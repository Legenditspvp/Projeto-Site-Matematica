<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Original Sports - Encontre sua Quadra</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Roboto+Condensed:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/dist/css/all.min.css">
</head>
<body class="dark-mode">
    <header>
        <nav class="navbar">
            <div class="logo">Original Sports</div>
            <div class="search-bar">
                <i class="fas fa-search"></i>
                <input type="text" placeholder="Buscar quadras, esportes...">
            </div>
            <div class="profile">
                <div class="avatar">
                    <img src="https://i.pravatar.cc/150?u=originalsports" alt="Perfil">
                </div>
            </div>
        </nav>
    </header>

    <div class="filter-dashboard">
        <div class="chips-container">
            <button class="chip active" data-filter="all">Todas</button>
            <button class="chip" data-filter="basquete">🏀 Basquete</button>
            <button class="chip" data-filter="futebol">⚽ Futebol</button>
            <button class="chip" data-filter="volei">🏐 Vôlei</button>
            <button class="chip" data-filter="proximas">📍 Próximas</button>
            <button class="chip" data-filter="avaliadas">⭐ Melhor Avaliadas</button>
        </div>
    </div>

    <main id="court-grid" class="court-grid">
        <!-- Skeleton screens will be here initially -->
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
    </main>

    <button id="fab" class="fab">
        <i class="fas fa-plus"></i>
    </button>

    <!-- Modal de Detalhes -->
    <div id="modal-overlay" class="modal-overlay">
        <div class="modal-content glass">
            <button class="close-modal">&times;</button>
            <div class="modal-body">
                <div class="gallery">
                    <img id="modal-img" src="https://images.unsplash.com/photo-1546519638-68e109498ffc?w=800" alt="Quadra">
                </div>
                <div class="details-info">
                    <h2 id="modal-title">Arena Central</h2>
                    <p id="modal-address">Rua dos Esportes, 123</p>
                    <div class="modal-actions">
                        <button class="btn btn-primary"><i class="fas fa-map-marker-alt"></i> Como Chegar</button>
                        <button class="btn btn-secondary"><i class="fas fa-camera"></i> Adicionar Foto</button>
                    </div>
                    <div class="comments-section">
                        <h3>Comentários</h3>
                        <div class="chat-style">
                            <div class="comment"><strong>João:</strong> Quadra excelente!</div>
                            <div class="comment"><strong>Maria:</strong> Muito bem iluminada.</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Formulário Quick Add -->
    <div id="quick-add-modal" class="modal-overlay">
        <div class="modal-content glass small-modal">
            <button class="close-modal">&times;</button>
            <h2>Sugerir Nova Quadra</h2>
            <form id="quick-add-form">
                <div class="form-group">
                    <label>Nome da Quadra</label>
                    <input type="text" required>
                </div>
                <div class="form-group">
                    <label>Esporte</label>
                    <select>
                        <option>Basquete</option>
                        <option>Futebol</option>
                        <option>Vôlei</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary">Sugerir</button>
            </form>
        </div>
    </div>

    <footer>
        <div class="container">
            <p>&copy; 2024 Original Sports. Performance e Estilo.</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
